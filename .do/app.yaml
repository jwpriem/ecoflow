# DigitalOcean App Platform spec. Create with: doctl apps create --spec .do/app.yaml
# (or point the App Platform UI at this repo; it picks up the same settings).
name: ecoflow-energy
region: ams
services:
  - name: web
    github:
      repo: jwpriem/ecoflow
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    # The Node buildpack runs `npm ci` itself
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    # One instance: it runs the collectors, the Tibber Pulse stream and the battery control loop.
    # A Postgres advisory lock prevents double work if you ever scale out.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/auth/status
      initial_delay_seconds: 10
    envs:
      - key: NUXT_DATABASE_URL # Neon main branch, pooled connection string
        scope: RUN_TIME
        type: SECRET
      - key: NUXT_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NUXT_JOBS_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: NUXT_EMAIL_SMTP_HOST # SMTP2GO, EU region
        scope: RUN_TIME
        value: mail-eu.smtp2go.com
      - key: NUXT_EMAIL_SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: NUXT_EMAIL_SMTP_USER
        scope: RUN_TIME
        type: SECRET
      - key: NUXT_EMAIL_SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: NUXT_EMAIL_FROM
        scope: RUN_TIME
        value: WattsWise <hello@wattswise.eu>
      - key: NUXT_PUBLIC_SENTRY_DSN # Sentry, EU region (…ingest.de.sentry.io). Empty = no error reports
        scope: RUN_AND_BUILD_TIME
        value: ''
